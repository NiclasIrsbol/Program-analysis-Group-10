
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "array-bounds"
version = "0.1.0"
description = "Static array bounds analysis"
requires-python = ">=3.13"
dependencies = [
    "jpamb",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
]

[project.scripts]
array-bounds-interpreter = "interpreter:interpret"
array-bounds-analysis = "interpreter:analyse"
array-bounds-evaluate = "array_bounds_evaluation.evaluate:main"
array-bounds-syntactic-evaluate = "array_bounds_evaluation.syntactic_evaluate:main"
array-bounds-external-tools-evaluate = "array_bounds_evaluation.external_tools_evaluate:main"
array-bounds-replay-failures = "array_bounds_evaluation.replay_failures:main"

[tool.setuptools]
package-dir = {"" = "src", "array_bounds_evaluation" = "evaluation"}
packages = ["array_bounds_evaluation"]
py-modules = [
    "abstractions",
    "interval",
    "difference_bounds",
    "guard_facts",
    "interpreter",
    "syntactic",
]

[tool.uv.sources]
jpamb = { path = "../../", editable = true }
