[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "static"
version = "0.1.0"
description = "The start of an abstract interpreter"
requires-python = ">=3.13"
dependencies = [
  "hypothesis>=6.168.2",
  "jpamb",
]


[project.scripts]
static-interpreter = "static:interpret"
static-analysis = "static:analyse"
array-bounds-coverage = "array_bounds.evaluate:main"

[tool.uv.sources]
jpamb = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools]
py-modules = ["static", "abstractions"]
packages = ["array_bounds"]

[tool.setuptools.package-dir]
"" = "src"
array_bounds = "../array_bounds"
